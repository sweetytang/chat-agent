name: Backend

on:
  push:
    paths: ["backend/**", "frontend/packages/api-types/**", "Makefile", "docker-compose.yml", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "frontend/packages/api-types/**", "Makefile", "docker-compose.yml", ".github/workflows/backend.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: latest
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: uv sync --locked
      - run: uv run ruff format --check apps packages
      - run: uv run ruff check apps packages
      - run: uv run pytest -q apps/api-server/tests packages/lui-agent-runtime/tests
      - run: uv run python scripts/export_openapi.py
      - working-directory: .
        run: python frontend/packages/api-types/scripts/generate_types.py
      - working-directory: .
        run: git diff --exit-code -- frontend/packages/api-types/openapi.json frontend/packages/api-types/src/openapi.d.ts
