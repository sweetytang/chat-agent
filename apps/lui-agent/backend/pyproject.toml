[project]
name = "lui-agent-backend"
version = "0.1.0"
description = "Lui Agent FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115,<1.0",
    "alembic>=1.14,<2.0",
    "langchain-core>=0.3,<1.0",
    "langgraph>=0.2,<1.0",
    "langchain-openai>=0.3,<1.0",
    "pwdlib[argon2]>=0.2,<1.0",
    "pyjwt>=2.10,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "sqlalchemy[asyncio]>=2.0.36,<3.0",
    "asyncpg>=0.30,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.25,<1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[project.scripts]
lui-agent = "app.main:run"

[tool.ruff]
line-length = 100

[tool.fastapi]
entrypoint="app.main:app"
