line-length = 100
target-version = "py314"
src = ["app", "tests"]

[lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM", "C4", "RUF"]
# E501 由 formatter 处理；B008 会误报 FastAPI Depends；RUF001-003 会误报中文文本。
ignore = ["E501", "B008", "RUF001", "RUF002", "RUF003"]
fixable = ["ALL"]

[lint.isort]
known-first-party = ["app"]
combine-as-imports = true
force-sort-within-sections = true

[format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false
