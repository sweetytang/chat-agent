services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lui_agent
      POSTGRES_USER: lui_agent
      POSTGRES_PASSWORD: lui_agent
    ports:
      - "5433:5432"
    volumes:
      - lui-agent-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lui_agent -d lui_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lui-agent-postgres:
