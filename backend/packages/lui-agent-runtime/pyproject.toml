[project]
name = "lui-agent-runtime"
version = "0.1.0"
description = "Framework-independent LangGraph runtime and tool abstractions"
requires-python = ">=3.14"
dependencies = [
    "langchain-core>=0.3,<1.0",
    "langgraph>=0.2,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.25,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lui_agent_runtime"]
