[project]
name = "lui-agent-backend-workspace"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.25,<1.0",
    "ruff>=0.16.1",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.workspace]
members = ["apps/*", "packages/*"]
