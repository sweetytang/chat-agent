# Nginx 配置示例: https://agent.tenasourcing.com
# 请将其放置在云服务器 /etc/nginx/conf.d/agent.tenasourcing.com.conf

server {
    listen 80;
    server_name agent.tenasourcing.com;

    # 强制跳转 HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name agent.tenasourcing.com;

    # SSL 证书配置 (可使用 certbot 或自定义证书)
    ssl_certificate /etc/letsencrypt/live/agent.tenasourcing.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agent.tenasourcing.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 客户端上传与请求体限制
    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # 传递真实请求头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 支持 WebSocket 与 HTTP Keep-Alive
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 核心：必须禁用缓存与缓冲，以支持 SSE 流式打字机响应 (/runs/stream)
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
